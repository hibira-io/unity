name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Protocol and room tests
        run: dotnet run --project "Tests~/Hibira.Tests"
      - name: Compile against Unity's assemblies (Editor)
        run: dotnet build "Tests~/UnityCompile"
      - name: Compile against Unity's assemblies (WebGL player)
        run: dotnet build "Tests~/UnityCompile" -p:WebGL=true
      - name: Every asset has a .meta
        run: python3 "Tests~/check-meta.py"
      - name: Asset Store .unitypackage builds
        run: python3 "AssetStore~/build.py"

  webgl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tests~/webgl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
