name: asset-store
# Builds the Asset Store upload (Assets/Hibira as a .unitypackage) with
# AssetStore~/build.py, which needs no Unity Editor or license. On a v* tag it
# attaches the file to that GitHub release, so a release only needs
# Uploader > Upload and Submit in the Publisher Portal.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unitypackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the .unitypackage
        run: echo "PACKAGE_FILE=$(python3 'AssetStore~/build.py')" >> "$GITHUB_ENV"

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unitypackage
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ env.PACKAGE_FILE }}
