name: asset-store
# Builds the Asset Store upload (Assets/Hibira as a .unitypackage) with
# AssetStore~/build.py, which needs no Unity Editor or license. On a v* tag it
# attaches the file to that GitHub release, so a release only needs
# Uploader > Upload and Submit in the Publisher Portal.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unitypackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the .unitypackage
        run: echo "PACKAGE_FILE=$(python3 'AssetStore~/build.py')" >> "$GITHUB_ENV"

      - name: Keep the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unitypackage
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.PACKAGE_FILE }}
